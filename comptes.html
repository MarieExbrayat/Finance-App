    <script>
        const URL_CSV =
            "https://docs.google.com/spreadsheets/d/1Im12y5iMU5MbspzFcR01E9Lng65AaxYt-dvNOMvlqYU/export?format=csv&gid=0";

        let graphique = null;
        let donneesPatrimoine = [];
        let montantsVisibles = true;

        function lireCSV(texte) {
            const lignes = [];
            let ligne = [];
            let cellule = "";
            let guillemets = false;

            texte = texte.replace(/^\uFEFF/, "");

            for (let i = 0; i < texte.length; i++) {
                const caractere = texte[i];

                if (
                    caractere === '"' &&
                    guillemets &&
                    texte[i + 1] === '"'
                ) {
                    cellule += '"';
                    i++;
                } else if (caractere === '"') {
                    guillemets = !guillemets;
                } else if (caractere === "," && !guillemets) {
                    ligne.push(cellule);
                    cellule = "";
                } else if (
                    (caractere === "\n" || caractere === "\r") &&
                    !guillemets
                ) {
                    if (
                        caractere === "\r" &&
                        texte[i + 1] === "\n"
                    ) {
                        i++;
                    }

                    ligne.push(cellule);

                    if (ligne.some(valeur => valeur.trim() !== "")) {
                        lignes.push(ligne);
                    }

                    ligne = [];
                    cellule = "";
                } else {
                    cellule += caractere;
                }
            }

            if (cellule !== "" || ligne.length > 0) {
                ligne.push(cellule);

                if (ligne.some(valeur => valeur.trim() !== "")) {
                    lignes.push(ligne);
                }
            }

            // Détection du séparateur si le fichier utilise ; ou tabulation.
            if (lignes.length > 0 && lignes[0].length === 1) {
                const separateur = lignes[0][0].includes(";")
                    ? ";"
                    : lignes[0][0].includes("\t")
                        ? "\t"
                        : null;

                if (separateur) {
                    return texte
                        .split(/\r?\n/)
                        .filter(l => l.trim() !== "")
                        .map(l => {
                            const cellules = [];
                            let valeur = "";
                            let entreGuillemets = false;

                            for (let i = 0; i < l.length; i++) {
                                const c = l[i];

                                if (c === '"' && entreGuillemets && l[i + 1] === '"') {
                                    valeur += '"';
                                    i++;
                                } else if (c === '"') {
                                    entreGuillemets = !entreGuillemets;
                                } else if (c === separateur && !entreGuillemets) {
                                    cellules.push(valeur);
                                    valeur = "";
                                } else {
                                    valeur += c;
                                }
                            }

                            cellules.push(valeur);
                            return cellules;
                        });
                }
            }

            return lignes;
        }

        function normaliserNom(nom) {
            return String(nom ?? "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        function trouverColonne(entetes, nom) {
            return entetes.findIndex(
                entete => normaliserNom(entete) === normaliserNom(nom)
            );
        }

        function convertirMontant(valeur) {
            if (valeur == null || String(valeur).trim() === "") {
                return 0;
            }

            let propre = String(valeur)
                .replace(/\s/g, "")
                .replace(/[€]/g, "");

            if (propre.includes(",") && propre.includes(".")) {
                propre = propre.replace(/\./g, "").replace(",", ".");
            } else {
                propre = propre.replace(",", ".");
            }

            const montant = Number(propre);

            return Number.isFinite(montant) ? montant : 0;
        }

        function formaterEuros(valeur) {
            return valeur.toLocaleString("fr-FR", {
                style: "currency",
                currency: "EUR",
                maximumFractionDigits: 0
            });
        }

        function preparerDonnees(lignes) {
            if (lignes.length < 2) {
                throw new Error("Aucune donnée disponible.");
            }

            const entetes = lignes[0];

            const indexPeriode = trouverColonne(entetes, "PERIODE");

            if (indexPeriode === -1) {
                throw new Error("Colonne Période introuvable.");
            }

            const index = {
                courant: trouverColonne(entetes, "COURANT"),
                swile: trouverColonne(entetes, "SWILE"),
                livret: trouverColonne(entetes, "LIVRET A"),
                pea: trouverColonne(entetes, "PEA"),
                linxea: trouverColonne(entetes, "LINXEA"),
                generali: trouverColonne(entetes, "GENERALI")
            };

            if (Object.values(index).some(i => i === -1)) {
                throw new Error(
                    "Une ou plusieurs colonnes de comptes sont introuvables."
                );
            }

            const donnees = [];

            lignes.slice(1).forEach(cellules => {
                const periode = cellules[indexPeriode]?.trim();

                if (!periode) return;

                const montant = nom =>
                    convertirMontant(cellules[index[nom]] || "");

                const liquidites =
                    montant("courant") + montant("swile");

                const epargne = montant("livret");

                const financier =
                    montant("pea") +
                    montant("linxea") +
                    montant("generali");

                donnees.push({
                    periode,
                    liquidites,
                    epargne,
                    financier,
                    total: liquidites + epargne + financier
                });
            });

            return donnees;
        }

        function afficherIndicateurs(ligne) {
            document.getElementById("valeurLiquidites").textContent =
                formaterEuros(ligne.liquidites);

            document.getElementById("valeurEpargne").textContent =
                formaterEuros(ligne.epargne);

            document.getElementById("valeurFinancier").textContent =
                formaterEuros(ligne.financier);

            appliquerVisibilite();
        }

        function actualiserKPI() {
            if (donneesPatrimoine.length === 0) return;

            const select = document.getElementById("moisKPI");
            const index = Number(select.value);

            if (
                !Number.isInteger(index) ||
                index < 0 ||
                index >= donneesPatrimoine.length
            ) {
                return;
            }

            afficherIndicateurs(donneesPatrimoine[index]);
        }

        function remplirSelecteurMois() {
    const select = document.getElementById("moisKPI");
    select.innerHTML = "";

    donneesPatrimoine.forEach((ligne, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = ligne.periode;
        select.appendChild(option);
    });

    // Cherche le mois et l'année en cours.
    const maintenant = new Date();
    const moisActuel = maintenant.getMonth();
    const anneeActuelle = maintenant.getFullYear();

    const indexActuel = donneesPatrimoine.findIndex(ligne => {
        const date = analyserPeriode(ligne.periode);

        return date &&
            date.mois === moisActuel &&
            date.annee === anneeActuelle;
    });

    // Si le mois en cours n'existe pas dans le tableau,
    // on sélectionne le dernier mois disponible.
    const indexSelectionne = indexActuel !== -1
        ? indexActuel
        : donneesPatrimoine.length - 1;

    select.value = String(indexSelectionne);
    select.disabled = false;

    select.addEventListener("change", actualiserKPI);
}

    function analyserPeriode(periode) {
        const texte = String(periode).trim();

        // Formats : YYYY-MM ou YYYY-MM-DD
        let match = texte.match(/^(\d{4})-(\d{1,2})(?:-\d{1,2})?$/);

        if (match) {
            return {
                annee: Number(match[1]),
                mois: Number(match[2]) - 1
            };
        }

        // Formats : MM/YYYY ou DD/MM/YYYY
        match = texte.match(/^(\d{1,2})\/(\d{4})$/);

        if (match) {
            return {
                annee: Number(match[2]),
                mois: Number(match[1]) - 1
            };
        }

        match = texte.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

        if (match) {
            return {
                annee: Number(match[3]),
                mois: Number(match[2]) - 1
            };
        }

        // Formats textuels : août 2026, octobre 2026, etc.
        const normalise = texte
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        const moisFrancais = [
            "janvier", "fevrier", "mars", "avril",
            "mai", "juin", "juillet", "aout",
            "septembre", "octobre", "novembre", "decembre"
        ];

        match = normalise.match(/^([a-z]+)\s+(\d{4})$/);

        if (match) {
            const indexMois = moisFrancais.indexOf(match[1]);

            if (indexMois !== -1) {
                return {
                    annee: Number(match[2]),
                    mois: indexMois
                };
            }
        }

        return null;
    }
        function appliquerVisibilite() {
            document.querySelectorAll(".montant").forEach(element => {
                element.style.filter = montantsVisibles
                    ? "none"
                    : "blur(7px)";

                element.style.userSelect = montantsVisibles
                    ? "auto"
                    : "none";
            });
        }

        function creerGraphique(donnees) {
            const contexte = document
                .getElementById("graphiquePatrimoine")
                .getContext("2d");

            if (graphique) {
                graphique.destroy();
            }

            graphique = new Chart(contexte, {
                type: "bar",

                data: {
                    labels: donnees.map(item => item.periode),

                    datasets: [
                        {
                            label: "Liquidités",
                            data: donnees.map(item => item.liquidites),
                            backgroundColor: "#78866b",
                            stack: "patrimoine",
                            borderRadius: 3
                        },
                        {
                            label: "Épargne",
                            data: donnees.map(item => item.epargne),
                            backgroundColor: "#d6b878",
                            stack: "patrimoine",
                            borderRadius: 3
                        },
                        {
                            label: "Actifs financiers",
                            data: donnees.map(item => item.financier),
                            backgroundColor: "#829fc4",
                            stack: "patrimoine",
                            borderRadius: 3
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    interaction: {
                        mode: "index",
                        intersect: false
                    },

                    plugins: {
                        legend: {
                            display: false
                        },

                        tooltip: {
                            callbacks: {
                                label: contexte =>
                                    contexte.dataset.label + " : " +
                                    formaterEuros(contexte.parsed.y),

                                footer: elements => {
                                    const total = elements.reduce(
                                        (somme, element) =>
                                            somme + element.parsed.y,
                                        0
                                    );

                                    return "Patrimoine total : " +
                                        formaterEuros(total);
                                }
                            }
                        }
                    },

                    scales: {
                        x: {
                            stacked: true,
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxRotation: 45,
                                autoSkip: true
                            }
                        },

                        y: {
                            stacked: true,
                            beginAtZero: true,
                            grid: {
                                color: "#eeede7"
                            },
                            ticks: {
                                callback: valeur =>
                                    valeur.toLocaleString("fr-FR") + " €"
                            }
                        }
                    }
                }
            });
        }

        async function chargerPatrimoine() {
            const message = document.getElementById("message");
            const select = document.getElementById("moisKPI");

            try {
                const reponse = await fetch(URL_CSV);

                if (!reponse.ok) {
                    throw new Error(
                        "Impossible de charger le Google Sheet."
                    );
                }

                const texte = await reponse.text();

                if (texte.trim().startsWith("<")) {
                    throw new Error(
                        "Le Google Sheet n'est pas accessible en CSV. Vérifie le partage."
                    );
                }

                const lignes = lireCSV(texte);
                donneesPatrimoine = preparerDonnees(lignes);

                if (donneesPatrimoine.length === 0) {
                    throw new Error(
                        "Aucune donnée de patrimoine disponible."
                    );
                }

                remplirSelecteurMois();
                actualiserKPI();

                // Important : le graphique reçoit toutes les données.
                // Le changement de mois ne modifie jamais ce graphique.
                creerGraphique(donneesPatrimoine);

                message.textContent = "";
            } catch (erreur) {
                select.disabled = true;
                select.innerHTML = '<option value="">Indisponible</option>';
                message.textContent = "Erreur : " + erreur.message;
                console.error(erreur);
            }
        }

        chargerPatrimoine();
    </script>
</body>

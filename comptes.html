<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes comptes</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --background: #f5f4ef;
            --green: #78866b;
            --gold: #d6b878;
            --blue: #829fc4;
            --text: #30352e;
            --muted: #85877f;
            --white: #ffffff;
            --border: #e9e7df;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 0 100px;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .conteneur {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* EN-TÊTE */
        .entete {
            margin-bottom: 24px;
        }

        .entete h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .sous-titre {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* SÉLECTEUR DE MOIS : KPI UNIQUEMENT */
        .selection-mois {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding: 17px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .selection-mois label {
            font-size: 14px;
            font-weight: 700;
        }

        .selection-mois select {
            max-width: 55%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--background);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        /* KPI */
        .indicateurs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .indicateur {
            min-width: 0;
            padding: 19px 16px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 3px 12px #00000004;
        }

        .indicateur .libelle {
            display: block;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .indicateur .valeur {
            display: block;
            font-size: clamp(17px, 2.5vw, 23px);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .indicateur.liquidites {
            border-top: 4px solid var(--green);
        }

        .indicateur.epargne {
            border-top: 4px solid var(--gold);
        }

        .indicateur.financier {
            border-top: 4px solid var(--blue);
        }

        /* CARTE DU GRAPHIQUE */
        .carte {
            padding: 20px;
            margin-bottom: 20px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 3px 12px #00000004;
        }

        .titre-section {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 700;
        }

        .graphique-container {
            position: relative;
            width: 100%;
            height: 400px;
        }

        /* CURSEUR DE ZOOM */
        .zoom-graphique {
            margin-top: 22px;
            padding: 14px 16px;
            background: var(--background);
            border-radius: 12px;
        }

        .zoom-graphique label {
            display: block;
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 13px;
        }

        .zoom-graphique strong {
            color: var(--text);
        }

        #curseurZoom {
            display: block;
            width: 100%;
            margin: 0;
            accent-color: var(--green);
            cursor: pointer;
        }

        .zoom-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: var(--muted);
            font-size: 11px;
        }

        /* LÉGENDE */
        .legende {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .legende-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pastille {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        #message {
            margin: 12px 2px 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        #message.erreur {
            color: #b44747;
        }

        /* NAVIGATION : IDENTIQUE À INDEX.HTML */
        .navigation {
            position: fixed;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-around;
            padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
            background: #ffffffed;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .navigation a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 60px;
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
        }

        .navigation a span {
            font-size: 21px;
        }

        .navigation a.active {
            color: var(--green);
            font-weight: 700;
        }

        /* RESPONSIVE */
        @media (max-width: 520px) {
            .conteneur {
                padding: 24px 14px;
            }

            .entete h1 {
                font-size: 25px;
            }

            .indicateurs {
                gap: 8px;
            }

            .indicateur {
                padding: 14px 10px;
            }

            .indicateur .libelle {
                font-size: 12px;
            }

            .carte {
                padding: 16px;
            }

            .graphique-container {
                height: 340px;
            }

            .zoom-graphique {
                padding: 13px;
            }
        }

        @media (max-width: 380px) {
            .selection-mois {
                align-items: flex-start;
                flex-direction: column;
            }

            .selection-mois select {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>

<body>
<main class="conteneur">

    <header class="entete">
        <h1>Mes comptes 👛</h1>
        <p class="sous-titre">
            Évolution et répartition de mon patrimoine
        </p>
    </header>

    <!-- Le sélecteur modifie uniquement les KPI -->
    <section class="selection-mois">
        <label for="moisKPI">Patrimoine au mois de</label>
        <select id="moisKPI" disabled>
            <option value="">Chargement...</option>
        </select>
    </section>

    <!-- KPI -->
    <section class="indicateurs" aria-label="Répartition du patrimoine">

        <article class="indicateur liquidites">
            <span class="libelle">Liquidités</span>
            <span class="valeur montant" id="valeurLiquidites">—</span>
        </article>

        <article class="indicateur epargne">
            <span class="libelle">Épargne</span>
            <span class="valeur montant" id="valeurEpargne">—</span>
        </article>

        <article class="indicateur financier">
            <span class="libelle">Actifs financiers</span>
            <span class="valeur montant" id="valeurFinancier">—</span>
        </article>

    </section>

    <!-- GRAPHIQUE -->
    <section class="carte">
        <h2 class="titre-section">Évolution du patrimoine</h2>

        <div class="graphique-container">
            <canvas
                id="graphiquePatrimoine"
                role="img"
                aria-label="Évolution du patrimoine par mois">
            </canvas>
        </div>

        <!-- Zoom indépendant du sélecteur KPI -->
        <div class="zoom-graphique">
            <label for="curseurZoom">
                Période affichée :
                <strong id="valeurZoom">Chargement...</strong>
            </label>

            <input
                type="range"
                id="curseurZoom"
                min="1"
                max="1"
                value="1"
                step="1"
                disabled
                aria-label="Nombre de mois affichés dans le graphique">

            <div class="zoom-labels">
                <span>1 mois</span>
                <span id="maximumZoom">Historique complet</span>
            </div>
        </div>

        <div class="legende">
            <div class="legende-item">
                <span class="pastille" style="background:#78866b"></span>
                Liquidités
            </div>

            <div class="legende-item">
                <span class="pastille" style="background:#d6b878"></span>
                Épargne
            </div>

            <div class="legende-item">
                <span class="pastille" style="background:#829fc4"></span>
                Actifs financiers
            </div>
        </div>

        <p id="message" role="status" aria-live="polite">
            Chargement des données...
        </p>
    </section>

</main>

<script>
    const URL_CSV =
        "https://docs.google.com/spreadsheets/d/1Im12y5iMU5MbspzFcR01E9Lng65AaxYt-dvNOMvlqYU/export?format=csv&gid=0";

    let graphique = null;
    let donneesPatrimoine = [];
    let montantsVisibles = true;

    function lireCSV(texte) {
        texte = texte.replace(/^\uFEFF/, "");

        const premiereLigne = texte.split(/\r?\n/, 1)[0] || "";
        const compteurs = { ",": 0, ";": 0, "\t": 0 };
        let guillemets = false;

        for (let i = 0; i < premiereLigne.length; i++) {
            const c = premiereLigne[i];

            if (c === '"' && guillemets && premiereLigne[i + 1] === '"') {
                i++;
            } else if (c === '"') {
                guillemets = !guillemets;
            } else if (!guillemets && c in compteurs) {
                compteurs[c]++;
            }
        }

        const separateur = Object.keys(compteurs).reduce(
            (a, b) => compteurs[b] > compteurs[a] ? b : a
        );

        const lignes = [];
        let ligne = [];
        let cellule = "";
        guillemets = false;

        for (let i = 0; i < texte.length; i++) {
            const c = texte[i];

            if (c === '"' && guillemets && texte[i + 1] === '"') {
                cellule += '"';
                i++;
            } else if (c === '"') {
                guillemets = !guillemets;
            } else if (c === separateur && !guillemets) {
                ligne.push(cellule);
                cellule = "";
            } else if ((c === "\n" || c === "\r") && !guillemets) {
                if (c === "\r" && texte[i + 1] === "\n") i++;

                ligne.push(cellule);

                if (ligne.some(v => v.trim() !== "")) {
                    lignes.push(ligne);
                }

                ligne = [];
                cellule = "";
            } else {
                cellule += c;
            }
        }

        if (cellule !== "" || ligne.length > 0) {
            ligne.push(cellule);

            if (ligne.some(v => v.trim() !== "")) {
                lignes.push(ligne);
            }
        }

        return lignes;
    }

    function normaliserNom(nom) {
        return String(nom ?? "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim()
            .toUpperCase();
    }

    function trouverColonne(entetes, nom) {
        return entetes.findIndex(
            entete => normaliserNom(entete) === normaliserNom(nom)
        );
    }

    function convertirMontant(valeur) {
        if (valeur == null || String(valeur).trim() === "") return 0;

        let texte = String(valeur)
            .trim()
            .replace(/[\s\u00A0\u202F]/g, "")
            .replace(/[€]/g, "")
            .replace(/EUR/gi, "")
            .replace(/[−–]/g, "-");

        const negatifParentheses = /^\(.*\)$/.test(texte);
        texte = texte.replace(/[()]/g, "");
        texte = texte.replace(/[^0-9,.\-+]/g, "");

        if (!texte) return 0;

        if (texte.includes(",") && texte.includes(".")) {
            if (texte.lastIndexOf(",") > texte.lastIndexOf(".")) {
                texte = texte.replace(/\./g, "").replace(",", ".");
            } else {
                texte = texte.replace(/,/g, "");
            }
        } else if (texte.includes(",")) {
            texte = texte.replace(",", ".");
        } else if (/^-?\d{1,3}(\.\d{3})+$/.test(texte)) {
            texte = texte.replace(/\./g, "");
        }

        const montant = Number(texte);

        if (!Number.isFinite(montant)) return 0;

        return negatifParentheses ? -Math.abs(montant) : montant;
    }

    function formaterEuros(valeur) {
        return valeur.toLocaleString("fr-FR", {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 0
        });
    }

    function preparerDonnees(lignes) {
        if (lignes.length < 2) {
            throw new Error("Aucune donnée disponible.");
        }

        const entetes = lignes[0];
        const indexPeriode = trouverColonne(entetes, "PERIODE");

        if (indexPeriode === -1) {
            throw new Error("Colonne Période introuvable.");
        }

        const index = {
            courant: trouverColonne(entetes, "COURANT"),
            swile: trouverColonne(entetes, "SWILE"),
            livret: trouverColonne(entetes, "LIVRET A"),
            pea: trouverColonne(entetes, "PEA"),
            linxea: trouverColonne(entetes, "LINXEA"),
            generali: trouverColonne(entetes, "GENERALI")
        };

        if (Object.values(index).some(i => i === -1)) {
            throw new Error(
                "Une ou plusieurs colonnes de comptes sont introuvables."
            );
        }

        const donnees = [];

        lignes.slice(1).forEach(cellules => {
            const periode = cellules[indexPeriode]?.trim();
            if (!periode) return;

            const montant = nom =>
                convertirMontant(cellules[index[nom]] ?? "");

            const liquidites = montant("courant") + montant("swile");
            const epargne = montant("livret");
            const financier =
                montant("pea") +
                montant("linxea") +
                montant("generali");

            donnees.push({
                periode,
                liquidites,
                epargne,
                financier,
                total: liquidites + epargne + financier
            });
        });

        return donnees;
    }

    /* ANALYSE DES PÉRIODES POUR CHOISIR LE MOIS ACTUEL */
    function analyserPeriode(periode) {
        const texte = String(periode).trim();
        let match = texte.match(/^(\d{4})-(\d{1,2})(?:-\d{1,2})?$/);

        if (match) {
            return {
                annee: Number(match[1]),
                mois: Number(match[2]) - 1
            };
        }

        match = texte.match(/^(\d{1,2})\/(\d{4})$/);

        if (match) {
            return {
                annee: Number(match[2]),
                mois: Number(match[1]) - 1
            };
        }

        match = texte.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

        if (match) {
            return {
                annee: Number(match[3]),
                mois: Number(match[2]) - 1
            };
        }

        if (/^\d{5}(?:\.\d+)?$/.test(texte)) {
            const date = new Date(1899, 11, 30);
            date.setDate(date.getDate() + Math.floor(Number(texte)));

            return {
                annee: date.getFullYear(),
                mois: date.getMonth()
            };
        }

        const normalise = texte
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[-/]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        const moisFrancais = [
            "janvier", "fevrier", "mars", "avril",
            "mai", "juin", "juillet", "aout",
            "septembre", "octobre", "novembre", "decembre"
        ];

        match = normalise.match(/^([a-z]+)\s+(\d{4})$/);

        if (match) {
            const indexMois = moisFrancais.indexOf(match[1]);

            if (indexMois !== -1) {
                return {
                    annee: Number(match[2]),
                    mois: indexMois
                };
            }
        }

        match = normalise.match(/^(\d{4})\s+([a-z]+)$/);

        if (match) {
            const indexMois = moisFrancais.indexOf(match[2]);

            if (indexMois !== -1) {
                return {
                    annee: Number(match[1]),
                    mois: indexMois
                };
            }
        }

        return null;
    }

    /* KPI */
    function afficherIndicateurs(ligne) {
        document.getElementById("valeurLiquidites").textContent =
            formaterEuros(ligne.liquidites);

        document.getElementById("valeurEpargne").textContent =
            formaterEuros(ligne.epargne);

        document.getElementById("valeurFinancier").textContent =
            formaterEuros(ligne.financier);

        appliquerVisibilite();
    }

    function actualiserKPI() {
        if (!donneesPatrimoine.length) return;

        const index = Number(document.getElementById("moisKPI").value);

        if (
            !Number.isInteger(index) ||
            index < 0 ||
            index >= donneesPatrimoine.length
        ) {
            return;
        }

        afficherIndicateurs(donneesPatrimoine[index]);
    }

    function remplirSelecteurMois() {
        const select = document.getElementById("moisKPI");
        select.innerHTML = "";

        donneesPatrimoine.forEach((ligne, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = ligne.periode;
            select.appendChild(option);
        });

        const maintenant = new Date();

        const indexActuel = donneesPatrimoine.findIndex(ligne => {
            const date = analyserPeriode(ligne.periode);

            return date &&
                date.mois === maintenant.getMonth() &&
                date.annee === maintenant.getFullYear();
        });

        const indexSelectionne = indexActuel !== -1
            ? indexActuel
            : donneesPatrimoine.length - 1;

        select.value = String(indexSelectionne);
        select.disabled = false;
        select.addEventListener("change", actualiserKPI);
    }

    /* VISIBILITÉ DES MONTANTS */
    function appliquerVisibilite() {
        document.querySelectorAll(".montant").forEach(element => {
            element.style.filter = montantsVisibles
                ? "none"
                : "blur(7px)";

            element.style.userSelect = montantsVisibles
                ? "auto"
                : "none";
        });
    }

    /* GRAPHIQUE */
    function creerGraphique(donnees) {
        const contexte = document
            .getElementById("graphiquePatrimoine")
            .getContext("2d");

        if (graphique) graphique.destroy();

        graphique = new Chart(contexte, {
            type: "bar",

            data: {
                labels: donnees.map(item => item.periode),

                datasets: [
                    {
                        label: "Liquidités",
                        data: donnees.map(item => item.liquidites),
                        backgroundColor: "#78866b",
                        stack: "patrimoine",
                        borderRadius: 3
                    },
                    {
                        label: "Épargne",
                        data: donnees.map(item => item.epargne),
                        backgroundColor: "#d6b878",
                        stack: "patrimoine",
                        borderRadius: 3
                    },
                    {
                        label: "Actifs financiers",
                        data: donnees.map(item => item.financier),
                        backgroundColor: "#829fc4",
                        stack: "patrimoine",
                        borderRadius: 3
                    }
                ]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                interaction: {
                    mode: "index",
                    intersect: false
                },

                plugins: {
                    legend: {
                        display: false
                    },

                    tooltip: {
                        callbacks: {
                            label: contexte =>
                                contexte.dataset.label + " : " +
                                formaterEuros(contexte.parsed.y),

                            footer: elements => {
                                const total = elements.reduce(
                                    (somme, element) =>
                                        somme + element.parsed.y,
                                    0
                                );

                                return "Patrimoine total : " +
                                    formaterEuros(total);
                            }
                        }
                    }
                },

                scales: {
                    x: {
                        stacked: true,
                        grid: {
                            display: false
                        },
                        ticks: {
                            maxRotation: 45,
                            autoSkip: true
                        }
                    },

                    y: {
                        stacked: true,
                        beginAtZero: true,
                        grid: {
                            color: "#eeede7"
                        },
                        ticks: {
                            callback: valeur =>
                                valeur.toLocaleString("fr-FR") + " €"
                        }
                    }
                }
            }
        });
    }

    /* ZOOM : MODIFIE UNIQUEMENT LA FENÊTRE DU GRAPHIQUE */
    function actualiserZoom() {
        const curseur = document.getElementById("curseurZoom");
        const valeurZoom = document.getElementById("valeurZoom");

        if (!donneesPatrimoine.length || !graphique) return;

        const nombre = Math.max(
            1,
            Math.min(Number(curseur.value), donneesPatrimoine.length)
        );

        const donneesAffichees = donneesPatrimoine.slice(-nombre);

        if (nombre >= donneesPatrimoine.length) {
            valeurZoom.textContent = "Tout l’historique";
        } else {
            valeurZoom.textContent = nombre +
                (nombre > 1 ? " derniers mois" : " dernier mois");
        }

        graphique.data.labels =
            donneesAffichees.map(item => item.periode);

        graphique.data.datasets[0].data =
            donneesAffichees.map(item => item.liquidites);

        graphique.data.datasets[1].data =
            donneesAffichees.map(item => item.epargne);

        graphique.data.datasets[2].data =
            donneesAffichees.map(item => item.financier);

        graphique.update();
    }

    function initialiserZoom() {
        const curseur = document.getElementById("curseurZoom");
        const maximumZoom = document.getElementById("maximumZoom");

        curseur.max = String(donneesPatrimoine.length);
        curseur.value = String(
            Math.min(12, donneesPatrimoine.length)
        );
        curseur.disabled = false;

        maximumZoom.textContent =
            donneesPatrimoine.length + " mois";

        curseur.addEventListener("input", actualiserZoom);
        actualiserZoom();
    }

    /* CHARGEMENT DES DONNÉES */
    async function chargerPatrimoine() {
        const message = document.getElementById("message");
        const select = document.getElementById("moisKPI");

        try {
            const reponse = await fetch(URL_CSV, {
                cache: "no-store"
            });

            if (!reponse.ok) {
                throw new Error(
                    "Impossible de charger le Google Sheet."
                );
            }

            const texte = await reponse.text();

            if (texte.trim().startsWith("<")) {
                throw new Error(
                    "Le Google Sheet n'est pas accessible en CSV. Vérifie le partage."
                );
            }

            const lignes = lireCSV(texte);
            donneesPatrimoine = preparerDonnees(lignes);

            if (!donneesPatrimoine.length) {
                throw new Error(
                    "Aucune donnée de patrimoine disponible."
                );
            }

            remplirSelecteurMois();
            actualiserKPI();

            // Le graphique reçoit tout l'historique.
            // Le zoom n'affiche ensuite qu'une partie des données.
            creerGraphique(donneesPatrimoine);
            initialiserZoom();

            message.textContent = "";
        } catch (erreur) {
            select.disabled = true;
            select.innerHTML =
                '<option value="">Indisponible</option>';

            message.classList.add("erreur");
            message.textContent = "Erreur : " + erreur.message;

            console.error(erreur);
        }
    }

    chargerPatrimoine();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une opération</title>

    <style>
        :root {
            --background: #f5f4ef;
            --card: #ffffff;
            --text: #252820;
            --muted: #77796f;
            --green: #78866b;
            --border: #e8e6df;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 20px 110px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.5;
        }

        .boutons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bouton {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: border-color 0.2s, color 0.2s;
        }

        .bouton:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .bouton .icone {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            background: #f0f1eb;
            color: var(--green);
            border-radius: 10px;
            font-size: 23px;
        }

        /* Navigation principale, identique aux autres pages */
        .navigation {
            position: fixed;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-around;
            padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
            background: #ffffffed;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .navigation a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 60px;
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
        }

        .navigation a span {
            font-size: 21px;
        }

        .navigation a.active {
            color: var(--green);
            font-weight: 700;
        }

        @media (min-width: 600px) {
            body {
                max-width: 700px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Ajouter</h1>
        <p>Que souhaites-tu ajouter ?</p>

        <div class="boutons">
            <a class="bouton" href="formulaire_depense.html">
                <span class="icone" aria-hidden="true">↗</span>
                <span>Ajouter une dépense</span>
            </a>

            <a class="bouton" href="formulaire_compte.html">
                <span class="icone" aria-hidden="true">＋</span>
                <span>Ajouter un solde</span>
            </a>
        </div>
    </main>

    <nav class="navigation" aria-label="Navigation principale">
        <a href="index.html">
            <span aria-hidden="true">⌂</span>
            Accueil
        </a>
        <a href="comptes.html">
            <span aria-hidden="true">▤</span>
            Comptes
        </a>
        <a href="depenses.html">
            <span aria-hidden="true">↗</span>
            Dépenses
        </a>
        <a href="ajout.html" class="active" aria-current="page">
            <span aria-hidden="true">＋</span>
            Ajouter
        </a>
    </nav>
</body>
</html>
